<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ラストウォー</title>
<style>
:root{
  --void:#0a0d0f;
  --plate:#12171a;
  --etch:#1e262b;
  --phos:#7dd3a0;
  --amber:#e8a33d;
  --rust:#c4573f;
  --txt:#dfe6e4;
  --dim:#6b7a80;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--void);
  color:var(--txt);
  font-family:"SF Mono",ui-monospace,Menlo,monospace;
  min-height:100vh;
  padding-bottom:calc(78px + env(safe-area-inset-bottom));
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ── 上部ステータスバー ── */
.bar{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 4px 12px;
  border-bottom:1px solid var(--etch);
  margin-bottom:16px;
}
.bar .id{font-size:14px;letter-spacing:.1em;color:var(--dim)}
.bar{gap:8px}
.bar .id{display:none}
.srv{
  display:inline-flex;align-items:center;
  border:1px solid var(--etch);border-radius:4px;
  color:var(--dim);font-size:14px;padding:6px 8px 6px 10px;
}
.srvin{
  background:none;border:none;outline:none;
  color:var(--phos);font-family:inherit;font-size:14px;font-weight:600;
  width:4.2em;padding:0 0 0 2px;
  -moz-appearance:textfield;
}
.srvin::-webkit-outer-spin-button,.srvin::-webkit-inner-spin-button{
  -webkit-appearance:none;margin:0;
}
.bar .tm{
  font-size:14px;color:var(--phos);font-variant-numeric:tabular-nums;
  background:none;border:1px solid var(--etch);border-radius:3px;
  font-family:inherit;padding:6px 10px;cursor:pointer;
  display:flex;align-items:center;gap:8px;
}
.bar .tm:active{background:var(--plate)}
.bar .tm #tzlab{
  font-size:14px;letter-spacing:.06em;color:var(--dim);
}
.bar .tm b{font-weight:400;color:var(--dim);margin-right:6px}

/* ── 見出し ── */
.eyebrow{
  font-size:14px;letter-spacing:.18em;color:var(--dim);
  margin:0 4px 8px;
}

/* ── ダッシュボード主枠 ── */
.hero{
  position:relative;display:block;width:100%;text-align:left;
  background:var(--plate);
  border:1px solid var(--etch);
  border-left:2px solid var(--amber);
  padding:20px 20px 18px;
  margin-bottom:8px;
  color:inherit;font-family:inherit;cursor:pointer;
}
.hero:active{background:#171d21}
.vsday{
  font-size:26px;font-weight:600;line-height:1.25;margin-top:4px;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.hr{height:1px;background:var(--etch);margin:14px 0 12px}
/* 軍拡パネル */
.prow{
  display:grid;
  grid-template-columns:20px 4.5em 1fr;
  align-items:baseline;column-gap:10px;
  margin-top:10px;
}
.prow .lb{font-size:14px;color:var(--dim)}
.prow .cat{
  font-family:-apple-system,"Hiragino Sans",sans-serif;font-weight:600;
  white-space:nowrap;
}
.prow .rng{
  font-size:14px;font-variant-numeric:tabular-nums;
  color:var(--dim);
  display:grid;grid-template-columns:1.4em auto;justify-content:end;
  column-gap:2px;
}
.prow .rng .pf{text-align:right}
.prow .rng .tm{text-align:right;white-space:nowrap}
.prow .rem{
  font-size:20px;font-weight:500;color:var(--phos);
  font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap;
}
.prow.now .cat{font-size:18px;color:var(--txt)}
.prow.now .rng{color:var(--dim)}
.prow.nxt .lb{color:var(--dim)}
.prow.nxt .cat{font-size:16px;font-weight:400;color:var(--dim)}
.prow.nxt .rng{color:var(--dim)}
.hero .k{font-size:14px;letter-spacing:.14em;color:var(--amber);margin-bottom:12px}
.hero .v{
  font-size:44px;font-weight:600;line-height:1;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
  letter-spacing:-.01em;
}
.hero .meta{font-size:14px;color:var(--dim);margin-top:9px;font-variant-numeric:tabular-nums}
.hero .cd{
  margin-top:16px;padding-top:13px;border-top:1px solid var(--etch);
  display:flex;justify-content:space-between;align-items:baseline;
}
.hero .cd .l{font-size:14px;letter-spacing:.16em;color:var(--dim)}
.hero .cd .r{font-size:30px;font-weight:500;color:var(--phos);font-variant-numeric:tabular-nums}

/* ── 行カード ── */
.card{
  display:block;width:100%;text-align:left;
  background:var(--plate);
  border:1px solid var(--etch);
  padding:13px 16px;
  margin-bottom:8px;
  color:inherit;font-family:inherit;font-size:inherit;
  cursor:pointer;
}
.card:active{background:#171d21}
.card .top{display:flex;justify-content:space-between;align-items:center}
.card>.name,.thd .name{display:block;margin-bottom:4px;color:var(--amber)}
.gline{
  font-size:16px;color:var(--txt);margin-top:6px;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
  display:flex;justify-content:space-between;align-items:baseline;
}
.gline .lead{color:var(--dim);font-size:14px}
.gline2{margin-top:4px}
.gline .rt{display:flex;align-items:baseline;gap:8px}
.gline .gcat{font-weight:600}
.gline .gnum{color:var(--phos);font-weight:600;font-variant-numeric:tabular-nums}
.gline .wait{color:var(--dim)}
.thd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px}
.thd .name{margin:0}
.cnt{display:flex;align-items:baseline;gap:8px}
.cnt .cl{font-size:14px;color:var(--dim)}
.cnt .cv{
  font-size:18px;font-weight:500;color:var(--phos);
  font-variant-numeric:tabular-nums;
}
.card .name{
  font-size:14px;letter-spacing:.04em;color:var(--amber);
  line-height:1.45;padding-right:12px;
}
.card .val{
  font-size:18px;font-weight:500;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.card .sub{font-size:14px;color:var(--dim);margin-top:5px;font-variant-numeric:tabular-nums}
.card .top{align-items:flex-start}
.card .rstack{
  display:flex;flex-direction:column;align-items:flex-end;gap:3px;
}
.card .swap{
  font-size:14px;color:var(--rust);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.stack{display:flex;flex-direction:column;gap:8px}
.stack .ln{
  display:flex;justify-content:space-between;align-items:center;
  font-size:16px;color:var(--txt);
}
.stack .ln i{font-style:normal;color:var(--txt)}
.mk{
  display:inline-flex;align-items:center;justify-content:center;
  width:28px;height:28px;border-radius:50%;
  font-size:16px;font-weight:700;line-height:1;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.mk.ok{background:var(--phos);color:#0a0d0f}
.mk.tri{background:var(--amber);color:#0a0d0f}
.mk.no{background:#2b3238;color:#8d99a0}

.thead{
  display:flex;align-items:center;
  padding:9px 16px;border-bottom:1px solid var(--etch);
  background:#161c20;
}
.thead .h{width:58px}
.thead .c{flex:1}
.thead .g,.tr .g{
  display:grid;grid-template-columns:56px 56px;
  justify-items:center;align-items:center;
}
.thead .g span{
  font-size:14px;color:var(--dim);white-space:nowrap;
}
.ok{color:var(--phos)} .no{color:var(--txt)} .tri{color:var(--amber)}

/* ── 明細ページ ── */
.page{display:none;padding-top:2px}
.page.on{display:block}
.panel{
  background:var(--plate);
  border:1px solid var(--etch);
  padding:18px 18px 16px;
  margin-bottom:10px;
}
.panel .k{font-size:14px;letter-spacing:.14em;color:var(--dim);margin-bottom:11px}
.panel .big{
  font-size:36px;font-weight:600;line-height:1.1;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.panel .num{font-size:38px;font-weight:500;color:var(--phos);font-variant-numeric:tabular-nums;line-height:1.1}
.panel .note{font-size:14px;color:var(--dim);margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.6}
.panel.alt{border-left:2px solid var(--rust)}
.panel.alt .num{color:var(--rust)}

.tbl{background:var(--plate);border:1px solid var(--etch)}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:0 0 8px}
.dayhead .eyebrow{margin:0}
.dayhead .nav{
  background:none;border:1px solid var(--etch);border-radius:4px;
  color:var(--dim);font-family:inherit;font-size:18px;line-height:1;
  width:34px;height:30px;cursor:pointer;
}
.dayhead .nav:active{background:var(--plate);color:var(--txt)}
.grow{display:flex;align-items:center;gap:14px}
.tin{
  flex:none;background:var(--void);color:var(--txt);
  border:1px solid var(--etch);border-radius:4px;
  font-family:inherit;font-size:20px;padding:9px 12px;
  font-variant-numeric:tabular-nums;
}
.gres{
  font-size:26px;font-weight:600;color:var(--phos);
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.tr .n{font-size:14px;color:var(--dim);width:64px}
.tr.cand .n{color:var(--phos)}
.gcard{
  background:var(--plate);border:1px solid var(--etch);
  padding:15px 16px;margin-bottom:8px;
}
.gcard .gh{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px}
.gcard .gc{
  font-size:20px;font-weight:600;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.gcard .gt{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.gcard .grow{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:8px;font-size:15px;
}
.gcard .grow .lb{color:var(--dim);font-size:14px}
.gcard .grow .rv{
  font-variant-numeric:tabular-nums;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.gcard .grow .rv.on{color:var(--phos);font-weight:600}
.gcard .grow .rv.off{color:var(--dim)}
.gcard.soon{border-left:2px solid var(--amber)}
.tframe{
  background:var(--plate);border:1px solid var(--etch);
  border-radius:0;margin-bottom:8px;overflow:hidden;
}
.tframe.cur{border-top-color:var(--phos);border-right-color:var(--phos);border-bottom-color:var(--phos);background:#141a16}
.tframe .th{
  display:flex;align-items:baseline;gap:10px;
  padding:12px 16px 10px;border-bottom:1px solid var(--etch);
}
.tframe.cur .th{border-bottom-color:#24402a}
.tframe .th .rng{font-size:14px;color:var(--dim);font-variant-numeric:tabular-nums}
.tframe.cur .th .rng{color:var(--phos)}
.tframe .th .catsub{font-size:13px;color:var(--dim)}
.tframe .th .cat{
  font-size:16px;font-weight:600;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.tframe .th .now{
  margin-left:auto;font-size:11px;letter-spacing:.1em;color:var(--phos);
}
.titem{
  display:flex;align-items:center;gap:12px;
  padding:11px 16px;border-bottom:1px solid var(--etch);
  cursor:pointer;
}
.titem:last-child{border-bottom:none}
.titem .box{
  width:20px;height:20px;flex:none;border-radius:5px;
  border:1.5px solid var(--dim);
  display:flex;align-items:center;justify-content:center;
  font-size:13px;color:var(--void);
}
.titem.done .box{background:var(--phos);border-color:var(--phos)}
.titem .tx{font-size:15px;font-family:-apple-system,"Hiragino Sans",sans-serif}
.titem.done .tx{color:var(--dim);text-decoration:line-through}
.titem .tt{margin-left:auto;font-size:13px;color:var(--dim);font-variant-numeric:tabular-nums}
.titem .badge{color:var(--phos);font-weight:600;margin-left:6px}
.hint{
  font-size:14px;color:var(--dim);text-align:center;
  margin-top:10px;letter-spacing:.02em;
}
.tr{
  display:flex;align-items:center;gap:14px;
  padding:12px 16px;border-bottom:1px solid var(--etch);
}
.tr:last-child{border-bottom:none}
.tr.hit{background:#1a2119;border-left:2px solid var(--phos);padding-left:14px}
.tr .h{font-size:14px;color:var(--dim);width:58px;font-variant-numeric:tabular-nums}
.tr.hit .h{color:var(--phos)}
.tr .c{
  font-size:16px;flex:1;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.tr.hit .c{color:var(--phos);font-weight:600}
.tr .g{font-size:14px;color:var(--dim)}

.duo{display:flex;gap:8px;margin-bottom:10px}
.duo>div{
  flex:1;background:var(--plate);border:1px solid var(--etch);
  padding:15px 16px;
}
.duo .k{font-size:14px;letter-spacing:.12em;color:var(--dim);margin-bottom:9px}
.duo .a{
  font-size:24px;font-weight:600;
  font-family:-apple-system,"Hiragino Sans",sans-serif;
}
.duo .n{font-size:14px;color:var(--dim);margin-top:5px;line-height:1.5}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:1px;background:var(--etch);
  border:1px solid var(--etch);
}
.grid span{
  background:var(--plate);
  padding:13px 4px;text-align:center;
  font-size:16px;color:var(--txt);font-variant-numeric:tabular-nums;
}

/* ── タブ ── */
nav{
  position:fixed;bottom:0;left:0;right:0;
  background:rgba(10,13,15,.94);
  backdrop-filter:blur(14px);
  border-top:1px solid var(--etch);
  padding-bottom:env(safe-area-inset-bottom);
  z-index:10;
}
nav .in{display:flex;max-width:520px;margin:0 auto}
nav button{
  flex:1;background:none;border:none;color:var(--dim);
  padding:13px 2px 14px;
  font-family:inherit;font-size:14px;letter-spacing:.02em;
  cursor:pointer;border-top:2px solid transparent;margin-top:-1px;
}
nav button.on{color:var(--phos);border-top-color:var(--phos)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <div class="bar">
    <span class="srv">#<input class="srvin" id="srvin" type="number" inputmode="numeric" /></span>
    <button class="tm" id="tz"><span id="tzlab"></span><span id="tzclock"></span></button>
  </div>

  <!-- ダッシュボード -->
  <div class="page on" id="p-home">

    <button class="hero" data-go="vs">
      <div class="k">今日は</div>
      <div class="vsday" id="h-vs">—</div>
      <div class="hr"></div>
      <div class="stack" id="h-vs2"></div>
    </button>

    <button class="card" data-go="arms">
      <div class="thd">
        <span class="name">軍拡</span>
        <span class="cnt"><span class="cl">切替まで</span><span class="cv" id="h-cd">—</span></span>
      </div>
      <div class="prow now">
        <span class="lb">今</span>
        <span class="cat" id="h-a1c"></span>
        <span class="rng" id="h-a1t"></span>
      </div>
      <div class="prow nxt">
        <span class="lb">次</span>
        <span class="cat" id="h-a2c"></span>
        <span class="rng" id="h-a2t"></span>
      </div>
    </button>

    <button class="card" data-go="arms">
      <div class="thd">
        <span class="name">兵士育成</span>
        <span class="cnt"><span class="cl">次の軍拡まで</span><span class="cv" id="d-tr">—</span></span>
      </div>
      <div class="prow now">
        <span class="lb"></span>
        <span class="cat">兵士</span>
        <span class="rng" id="d-tr-rng"></span>
      </div>
    </button>

    <button class="card" data-go="gov">
      <div class="name">長官</div>
      <div class="gline" id="d-gov">—</div>
      <div class="gline gline2" id="d-gov2"></div>
    </button>

    <button class="card" data-go="task">
      <div class="top">
        <span class="name">極秘任務</span>
        <span class="val" id="d-task">—</span>
      </div>
    </button>
  </div>

  <!-- 軍拡 -->
  <div class="page" id="p-arms">
    <div class="hero">
      <div class="k">現在の軍拡</div>
      <div class="v" id="a-cat">—</div>
      <div class="meta" id="a-meta"></div>
      <div class="cd">
        <span class="l">切替まで</span>
        <span class="r" id="a-cd">—</span>
      </div>
    </div>
    <div class="dayhead">
      <button class="nav" id="a-prev" aria-label="前日">‹</button>
      <span class="eyebrow" id="a-day">スケジュール</span>
      <button class="nav" id="a-next" aria-label="翌日">›</button>
    </div>
    <div class="tbl" id="a-tbl"></div>
    <div class="hint" id="a-hint"></div>
  </div>

  <!-- VS -->
  <div class="page" id="p-vs">
    <div class="panel">
      <div class="k" id="v-day">VS デイリー</div>
      <div class="big" id="v-theme">—</div>
    </div>
    <div class="eyebrow">週間</div>
    <div class="tbl" id="v-tbl"></div>
  </div>

  <!-- 極秘任務 -->
  <div class="page" id="p-task">
    <div class="panel">
      <div class="k">本日のキラキラサーバー</div>
      <div class="big">グループ <span id="t-grp">—</span></div>
      <div class="note">切替まで <span id="t-cd">—</span></div>
    </div>
    <div class="eyebrow">対象サーバー</div>
    <div class="grid" id="t-grid"></div>
  </div>

  <!-- 長官 -->
  <div class="page" id="p-gov">
    <div class="eyebrow">軍拡が近い順・就任が時間内に収まる並び順</div>
    <div id="g-list"></div>
  </div>

  <!-- 今日やること -->
  <div class="page" id="p-todo">
    <div class="eyebrow" id="todo-day">今日やること</div>
    <div id="todo-list"></div>
  </div>
  </div>

</div>

<nav><div class="in">
  <button class="on" data-tab="home">ホーム</button>
  <button data-tab="vs">VS</button>
  <button data-tab="arms">軍拡</button>
  <button data-tab="task">任務</button>
  <button data-tab="gov">長官</button>
  <button data-tab="todo">予定</button>
</div></nav>

<script>

const DAYS=["日","月","火","水","木","金","土"];
const SLOTS=[0,4,8,12,16,20];            // サーバー時
const pad=n=>String(n).padStart(2,"0");

// 軍拡：サーバー曜日 → slot0..5

  1:["基地","兵士","英雄","科学","ドローン","英雄"],
  2:["兵士","科学","基地","ドローン","英雄","基地"],

  5:["科学","ドローン","兵士","英雄","基地","兵士"],
  6:["兵士","科学","基地","ドローン","英雄","基地"],
  0:["ドローン","英雄","科学","基地","兵士","科学"]
};

// VS：テーマ / レーダー / UR   (○=やる △=やる(対象外) ×=やらない)
const VS={
  1:["ドローン","○","×"],
  2:["基地","×","○"],
  3:["科学","○","×"],
  4:["英雄","×","×"],
  5:["準備","○","×"],

  0:["ー","×","×"]

// サーバー → グループ
const SRV={

};

/* ══ 時間軸 ══
   サーバー時間 = JST − 11h。端末TZに依存しないよう UTC から直接算出。
   server = UTC − 2h  ( = JST(UTC+9) − 11h )                        */
function serverNow(d){ return new Date(d.getTime()-2*3600*1000); }
function sParts(sv){
  return {day:sv.getUTCDay(), hour:sv.getUTCHours(),
          min:sv.getUTCMinutes(), sec:sv.getUTCSeconds()};
}
// サーバー時hour → JST時
const toJst=h=>(h+11)%24;

// 表示モード： "jst" | "srv"
let DAYOFF = 0;
let MODE = (()=>{ try{return localStorage.getItem("lw_tz")||"jst";}catch(e){return "jst";} })();
function setMode(m){
  MODE=m;
  try{localStorage.setItem("lw_tz",m);}catch(e){}
  render();
}
// サーバー時hour を 表示モードのhourへ
const dispH = h => MODE==="jst" ? (h+11)%24 : h;
// 表示モードのラベル
const tzName = () => MODE==="jst" ? "JST" : "サーバー";

// slotIndex（0-5）
const slotOf=h=>Math.floor(h/4);

// 現在slotの開始からn個先のslot情報 {day,slot,startDate}
function slotAt(now,n){
  const sv=serverNow(now), p=sParts(sv);
  const base=Date.UTC(sv.getUTCFullYear(),sv.getUTCMonth(),sv.getUTCDate(),
                      slotOf(p.hour)*4,0,0);
  const t=new Date(base+n*4*3600*1000);
  return {day:t.getUTCDay(), slot:slotOf(t.getUTCHours()),
          real:new Date(t.getTime()+2*3600*1000)};   // 実時刻(UTC基準Date)
}
function hms(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60);
}
function hm(ms){
  const s=Math.max(0,Math.floor(ms/1000));
  return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60));
}

// キラキラ グループ：シート式 CHAR(64+mod(serial,3)+1) を再現
function kiraGroup(sv){
  const serial=Math.floor(Date.UTC(sv.getUTCFullYear(),sv.getUTCMonth(),sv.getUTCDate())
                          /86400000)+25569;          // 1899-12-30 起点
  return "ABC"[serial%3];
}

/* ══ 描画 ══ */
function render(){
  const now=new Date();
  const sv=serverNow(now), p=sParts(sv);

  // ステータスバー
  { const el=document.getElementById("srvin");
      if(el && document.activeElement!==el) el.value=SELF_SRV; }
  document.getElementById("tzlab").textContent=tzName();
  document.getElementById("tzclock").textContent=
    DAYS[p.day]+" "+pad(dispH(p.hour))+":"+pad(p.min)+":"+pad(p.sec);

  /* ── 軍拡 ── */
  const cur=slotAt(now,0), nxt=slotAt(now,1);
  const cat=ARMS[cur.day][cur.slot];
  const sH=SLOTS[cur.slot], eH=SLOTS[nxt.slot];
  const meta=DAYS[cur.day]+"曜 "+pad(dispH(sH))+":00 – "+pad(dispH(eH))+":00";
  const cd=hms(nxt.real-now);

  const nxt2=slotAt(now,2);
  document.getElementById("h-a1t").innerHTML=
    '<span class="pf"></span><span class="tm">'+pad(dispH(sH))+":00 – "+pad(dispH(eH))+':00</span>';
  document.getElementById("h-a1c").textContent=cat;
  document.getElementById("h-a2t").innerHTML=
    '<span class="pf"></span><span class="tm">'+pad(dispH(eH))+":00 – "+pad(dispH(SLOTS[nxt2.slot]))+':00</span>';
  document.getElementById("h-a2c").textContent=ARMS[nxt.day][nxt.slot];
  document.getElementById("h-cd").textContent=cd;
  document.getElementById("a-cat").textContent=cat;
  document.getElementById("a-meta").textContent=meta;
  document.getElementById("a-cd").textContent=cd;

  const vd=(cur.day+DAYOFF%7+7)%7;
  document.getElementById("a-day").textContent=DAYS[vd]+"曜日のスケジュール";
  document.getElementById("a-hint").textContent=
    DAYOFF===0?"左右スワイプで他の曜日":
    (DAYOFF>0?"+"+DAYOFF+"日":DAYOFF+"日")+"　タップで戻る";
  const at=document.getElementById("a-tbl");
  at.innerHTML="";
  SLOTS.forEach((h,i)=>{
    const d=document.createElement("div");
    d.className="tr"+((DAYOFF===0&&i===cur.slot)?" hit":"");
    d.innerHTML='<span class="h">'+pad(dispH(h))+':00</span>'+
                '<span class="c">'+ARMS[vd][i]+'</span>';
    at.appendChild(d);
  });

  /* ── VS ── */
  const [th,rd,ur]=VS[cur.day];
  document.getElementById("h-vs").textContent=(th==="ー")?"お休み":th+"の日";
  document.getElementById("h-vs2").innerHTML=
    '<span class="ln"><i>UR</i><span class="mk '+mkCls(ur)+'">'+ur+'</span></span>'+
    '<span class="ln"><i>レーダー</i><span class="mk '+mkCls(rd)+'">'+rd+'</span></span>';

  document.getElementById("v-day").textContent=DAYS[cur.day]+"曜日";
  document.getElementById("v-theme").textContent=(th==="ー")?"お休み":th+"の日";

  const vt=document.getElementById("v-tbl");
  vt.innerHTML='<div class="thead"><span class="h"></span>'+
               '<span class="c"></span>'+
               '<span class="g"><span>UR</span><span>レーダー</span></span></div>';
  [1,2,3,4,5,6,0].forEach(dw=>{
    const [t,r,u]=VS[dw];
    const d=document.createElement("div");
    d.className="tr"+(dw===cur.day?" hit":"");
    d.innerHTML='<span class="h">'+DAYS[dw]+'</span>'+
                '<span class="c">'+t+'</span>'+
                '<span class="g"><span class="mk '+mkCls(u)+'">'+u+'</span>'+
                '<span class="mk '+mkCls(r)+'">'+r+'</span></span>';
    vt.appendChild(d);
  });

  /* ── 極秘任務 ── */
  const grp=kiraGroup(sv);
  document.getElementById("d-task").textContent=grp;
  document.getElementById("t-grp").textContent=grp;

  // サーバー0時までのカウントダウン
  const nextMid=Date.UTC(sv.getUTCFullYear(),sv.getUTCMonth(),sv.getUTCDate()+1,0,0,0);
  document.getElementById("t-cd").textContent=hm(nextMid-sv.getTime());

  const gr=document.getElementById("t-grid");
  const list=Object.keys(SRV).filter(k=>SRV[k]===grp).map(Number).sort((a,b)=>a-b);
  if(gr.dataset.g!==grp){
    gr.dataset.g=grp;
    gr.innerHTML=list.map(n=>"<span>"+n+"</span>").join("");
  }

  /* ── 兵士育成（ダッシュボードのみ） ── */
  let hit=null;
  for(let i=1;i<=42;i++){
    const t=slotAt(now,i);
    if(ARMS[t.day][t.slot]==="兵士"){ hit=t; break; }
  }
  if(hit){
    const dh=dispH(SLOTS[hit.slot]);
    const dhEnd=dispH((SLOTS[hit.slot]+4)%24);
    // 表示暦日で今日/翌日を判定（表示モードのオフセットを加味）
    const offMs=(MODE==="jst"?9:-2)*3600*1000;
    const dNow=new Date(now.getTime()+offMs);
    const dSt =new Date(hit.real.getTime()+offMs);
    const pre=(dSt.getUTCFullYear()!==dNow.getUTCFullYear()||
               dSt.getUTCMonth()!==dNow.getUTCMonth()||
               dSt.getUTCDate()!==dNow.getUTCDate())?"翌 ":"";
    document.getElementById("d-tr-rng").innerHTML=
      '<span class="pf">'+pre.trim()+'</span>'+
      '<span class="tm">'+pad(dh)+":00 – "+pad(dhEnd)+':00</span>';
    document.getElementById("d-tr").textContent=hms(hit.real-now);
  }
  /* ── 長官 ── */
  govRender(now);
  /* ── 今日やること ── */
  todoRender(now);
}

const GOV_STEP=5;
const GOV_CATS=["科学","基地","兵士"];
const GOV_LABEL={"科学":"科学","基地":"建造","兵士":"兵士"};
function govRender(now){
  const ms=60000*GOV_STEP;
  // 各カテゴリの「次の軍拡時間」を求める
  const items=GOV_CATS.map(cat=>{
    for(let i=0;i<=42;i++){
      const t=slotAt(now,i);
      if(ARMS[t.day][t.slot]===cat){
        const startReal=t.real;
        const endReal=new Date(startReal.getTime()+4*3600*1000);
        if(endReal>now) return {cat,startReal,endReal,slot:t.slot,day:t.day};
      }
    }
    return {cat,startReal:null};
  });
  // 軍拡が近い順（開始時刻昇順）
  items.sort((a,b)=>a.startReal-b.startReal);

  const box=document.getElementById("g-list");
  box.innerHTML="";
  items.forEach((it,idx)=>{
    const sH=SLOTS[it.slot], eH=(SLOTS[it.slot]+4)%24;
    const toStart=it.startReal-now;
    let nEarly=Math.max(1,Math.ceil((it.startReal-now)/ms)+1);
    let nLate =Math.floor((it.endReal-now)/ms);
    if(toStart<=0) nEarly=1;

    const candA=Math.min(nEarly,50), candB=Math.min(nLate,50);
    const appA=Math.max(nEarly,51)-50, appB=Math.min(nLate,100)-50;
    const fmt=(a,b)=> b<1 ? {t:"—",on:false}
                    : {t:(a===b?a+"番目":a+" 〜 "+b+"番目"),on:true};
    const c=fmt(candA,candB), ap=fmt(appA>=1?appA:0, appB>=1?appB:0);

    const el=document.createElement("div");
    el.className="gcard"+(idx===0?" soon":"");
    const status = toStart>0 ? "あと "+hm(toStart)+" で開始" : "進行中";
    let body;
    if(nEarly>100){
      body='<div class="grow"><span class="lb">まだ早い</span><span class="rv off"></span></div>';
    }else{
      body='<div class="grow"><span class="lb">候補者</span>'+
           '<span class="rv '+(c.on?"on":"off")+'">'+c.t+'</span></div>'+
           '<div class="grow"><span class="lb">応募者</span>'+
           '<span class="rv '+(ap.on?"on":"off")+'">'+ap.t+'</span></div>';
    }
    el.innerHTML=
      '<div class="gh"><span class="gc">'+(GOV_LABEL[it.cat]||it.cat)+'</span>'+
      '<span class="gt">'+pad(dispH(sH))+":00 – "+pad(dispH(eH))+':00</span></div>'+
      '<div class="gt" style="margin-bottom:4px">'+status+'</div>'+
      body;
    box.appendChild(el);
  });

  /* ── ダッシュボード：今並ぶなら（2枠） ── */
  function govLine(it,leadTxt){
    if(!it||it.startReal===null) return "";
    const label=GOV_LABEL[it.cat]||it.cat;
    const toStart=it.startReal-now;
    let nEarly=Math.max(1,Math.ceil((it.startReal-now)/ms)+1);
    let nLate =Math.floor((it.endReal-now)/ms);
    if(toStart<=0) nEarly=1;
    const candB=Math.min(nLate,50);
    let right;
    if(nEarly>100){
      right='<span class="gcat">'+label+'</span><span class="wait">まだ早い</span>';
    }else if(nEarly<=50 && candB>=1){
      const range=(nEarly===candB)?nEarly+"番目":nEarly+" 〜 "+candB+"番目";
      right='<span class="gcat">'+label+'</span><span class="gnum">候補 '+range+'</span>';
    }else{
      const aA=Math.max(nEarly,51)-50, aB=Math.min(nLate,100)-50;
      const range=(aA===aB)?aA+"番目":aA+" 〜 "+aB+"番目";
      right='<span class="gcat">'+label+'</span><span class="gnum">応募 '+range+'</span>';
    }
    return '<span class="lead">'+leadTxt+'</span><span class="rt">'+right+'</span>';
  }
  const dg=document.getElementById("d-gov");
  const dg2=document.getElementById("d-gov2");
  if(dg){
    const l1=govLine(items[0],"今並ぶなら");
    dg.innerHTML=l1||"—";
    // 2枠目：次に近い別カテゴリ
    const l2=govLine(items[1],"次は");
    if(dg2) dg2.innerHTML=l2;
  }
}

function mkCls(m){return m==="○"?"ok":m==="△"?"tri":"no";}

/* ══ タブ ══ */
/* ══ 今日やること ══ */
let SELF_SRV=(()=>{ try{return parseInt(localStorage.getItem("lw_srv"))||1251;}catch(e){return 1251;} })();
function setSelfSrv(n){
  SELF_SRV=n;
  try{localStorage.setItem("lw_srv",String(n));}catch(e){}
  render();
}
function serverDateKey(now){
  const sv=serverNow(now);
  return sv.getUTCFullYear()+"-"+pad(sv.getUTCMonth()+1)+"-"+pad(sv.getUTCDate());
}
let TODO_STATE=null, TODO_KEY=null;
function loadTodo(now){
  const k="lw_todo_"+serverDateKey(now);
  if(TODO_KEY===k && TODO_STATE) return;
  TODO_KEY=k;
  try{ TODO_STATE=JSON.parse(localStorage.getItem(k)||"{}"); }
  catch(e){ TODO_STATE={}; }
}
function saveTodo(){ try{ localStorage.setItem(TODO_KEY,JSON.stringify(TODO_STATE)); }catch(e){} }
function toggleTodo(id){
  loadTodo(new Date());
  TODO_STATE[id]=!TODO_STATE[id];
  saveTodo(); render();
}
function todoRender(now){
  loadTodo(now);
  const sv=serverNow(now);
  const box=document.getElementById("todo-list");
  if(!box) return;
  const svDay=sv.getUTCDay();
  // 各軍拡枠 slot0..5 = JST 11/15/19/23/3/7、そのカテゴリ
  const cats={};              // JST開始時 -> カテゴリ
  for(let i=0;i<6;i++){ cats[(SLOTS[i]+11)%24]=ARMS[svDay][i]; }
  // 現在の軍拡枠のJST開始
  const cur=slotAt(now,0);
  const curJh=(SLOTS[cur.slot]+11)%24;
  const grp=kiraGroup(sv), selfKira=(SRV[SELF_SRV]===grp);

  // ある時刻がどの軍拡カテゴリの時間帯か（4hさかのぼって直近の枠開始を探す）
  function catAt(jh){
    for(let d=0;d<24;d++){ const h=(jh-d+24)%24; if(cats[h]!==undefined) return {cat:cats[h],start:h}; }
    return {cat:"",start:jh};
  }

  // 時刻パネルを構築：キーはJST時刻
  const panels={};  // jh -> {items:[], cat, start}
  function ensure(jh){
    if(!panels[jh]){ const c=catAt(jh); panels[jh]={items:[],cat:c.cat,start:c.start}; }
    return panels[jh];
  }
  // 軍拡6枠：開始時刻パネルに「軍拡」「トラック」
  for(let i=0;i<6;i++){
    const jh=(SLOTS[i]+11)%24, cat=ARMS[svDay][i];
    const P=ensure(jh);
    P.items.push({id:"f"+i+"_arms", tx:"軍拡："+cat+"を進める"});
    if(jh!==3) P.items.push({id:"f"+i+"_truck", tx:"トラック1台出発"});
  }
  // 11:00：賞金首/ボス、貿易列車11/14、決闘、極秘(自分)、レーダー/UR、盟友(非キラキラ)
  ensure(11).items.push({id:"boss", tx:"賞金首 / ボス"});
  ensure(11).items.push({id:"train11", tx:"貿易列車"});
  ensure(14).items.push({id:"train14", tx:"貿易列車"});
  ensure(11).items.push({id:"duel", tx:"真昼の決闘"});
  ensure(11).items.push({id:"secret", tx:"極秘任務（自分）"});
  const vs=VS[svDay];
  if(vs[1]!=="\u00d7") ensure(11).items.push({id:"radar", tx:"レーダー"+(vs[1]==="\u25b3"?"（対象外）":"")});
  if(vs[2]!=="\u00d7") ensure(11).items.push({id:"ur", tx:"UR"});
  if(!selfKira) ensure(13).items.push({id:"ally", tx:"極秘任務（盟友）"});
  // 15:00：貿易列車18、他サーバー窃盗(グループ)、盟友(キラキラ)
  ensure(18).items.push({id:"train18", tx:"貿易列車"});
  ensure(15).items.push({id:"steal", tx:"極秘任務（他サーバー）", badge:grp});
  if(selfKira) ensure(15).items.push({id:"ally", tx:"極秘任務（盟友）"});
  // 19:00：貿易列車22
  ensure(22).items.push({id:"train22", tx:"貿易列車"});

  // 時刻順に並べる。運用起点は11:00 → 昇順で 11,13,14,15,18,19,22,23,3,7
  const order=Object.keys(panels).map(Number).sort((a,b)=>{
    const norm=x=> (x<11? x+24 : x);   // 11時起点で回す
    return norm(a)-norm(b);
  });

  const CATCOLOR={"兵士":"#c4573f","科学":"#3f6ea8","基地":"#c9a227","英雄":"#8659b5","ドローン":"#3fa8a0"};

  box.innerHTML="";
  order.forEach(jh=>{
    const P=panels[jh];
    const isFrameStart=(cats[jh]!==undefined);   // 軍拡が切り替わる時刻か
    const col=CATCOLOR[P.cat]||"#555";
    const isCur=(P.start===curJh);
    const el=document.createElement("div");
    el.className="tframe"+(isCur?" cur":"");
    el.style.borderLeftColor=col;
    el.style.borderLeftWidth="3px";
    let head='<div class="th">'+
      '<span class="rng">'+pad(jh)+':00</span>';
    if(isFrameStart) head+='<span class="cat" style="color:'+col+'">'+P.cat+'</span>';
    else head+='<span class="catsub">'+P.cat+'の時間帯</span>';
    if(isCur) head+='<span class="now">今ここ</span>';
    head+='</div>';
    let html=head;
    P.items.forEach(it=>{
      const done=!!TODO_STATE[it.id];
      html+='<div class="titem'+(done?" done":"")+'" data-tid="'+it.id+'">'+
        '<span class="box">'+(done?"\u2713":"")+'</span>'+
        '<span class="tx">'+it.tx+(it.badge?'<span class="badge">'+it.badge+'</span>':'')+'</span>'+
        '</div>';
    });
    el.innerHTML=html;
    box.appendChild(el);
  });
  document.getElementById("todo-day").textContent=DAYS[svDay]+"\u66dc\u65e5 \u3084\u308b\u3053\u3068";
  box.onclick=function(e){
    const row=e.target.closest(".titem");
    if(row) toggleTodo(row.dataset.tid);
  };
}

const PG={home:"p-home",arms:"p-arms",vs:"p-vs",task:"p-task",gov:"p-gov",todo:"p-todo"};
function go(t){
  DAYOFF=0;
  Object.values(PG).forEach(id=>document.getElementById(id).classList.remove("on"));
  document.getElementById(PG[t]).classList.add("on");
  document.querySelectorAll("nav button").forEach(b=>
    b.classList.toggle("on",b.dataset.tab===t));
  window.scrollTo(0,0);
}
document.querySelectorAll("nav button").forEach(b=>
  b.addEventListener("click",()=>go(b.dataset.tab)));
document.querySelectorAll("[data-go]").forEach(c=>
  c.addEventListener("click",()=>go(c.dataset.go)));

(function(){
  const el=document.getElementById("srvin");
  function commit(){
    const n=parseInt(el.value);
    if(n && SRV[n]!==undefined){ setSelfSrv(n); }
    else { el.value=SELF_SRV; }   // 無効なら元に戻す
  }
  el.addEventListener("change",commit);
  el.addEventListener("blur",commit);
  el.addEventListener("keydown",e=>{ if(e.key==="Enter") el.blur(); });
})();
document.getElementById("tz").addEventListener("click",()=>
  setMode(MODE==="jst"?"srv":"jst"));

/* ── 軍拡タブ：曜日送り ── */
function shiftDay(n){ DAYOFF=(DAYOFF+n%7+7)%7; render(); }
document.getElementById("a-prev").addEventListener("click",()=>shiftDay(-1));
document.getElementById("a-next").addEventListener("click",()=>shiftDay(1));
document.getElementById("a-hint").addEventListener("click",()=>{DAYOFF=0;render();});

(function(){
  const el=document.getElementById("p-arms");
  let x0=null,y0=null;
  el.addEventListener("touchstart",e=>{
    x0=e.changedTouches[0].clientX; y0=e.changedTouches[0].clientY;
  },{passive:true});
  el.addEventListener("touchend",e=>{
    if(x0===null) return;
    const dx=e.changedTouches[0].clientX-x0;
    const dy=e.changedTouches[0].clientY-y0;
    if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) shiftDay(dx<0?1:-1);
    x0=y0=null;
  },{passive:true});
})();

render();
setInterval(render,1000);
</script>
